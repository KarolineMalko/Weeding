<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Response - Wedding</title>
    <link rel="stylesheet" href="/public/styles.css?v=8" />
  </head>
  <body class="page-response">
    <nav class="navbar">
      <div class="nav-indicator" aria-hidden="true"></div>
      <a class="brand" href="/" data-i18n="nav.wedding">Wedding</a>
      <a class="nav-link" href="/church" data-i18n="nav.church">Church</a>
      <a class="nav-link" href="/venue" data-i18n="nav.venue">Venue</a>
      <a class="nav-link" href="/last" data-i18n="nav.more">More</a>
      <a class="nav-link" href="/response" data-i18n="nav.response">Response</a>
      <div class="lang-dropdown">
        <button class="lang-btn" aria-label="Language">EN</button>
        <div class="lang-menu">
          <button data-lang="en">English</button>
          <button data-lang="sv">Svenska</button>
        </div>
      </div>
    </nav>
    <main class="content response-content">
      <section class="response-form-section">
        <h1 data-i18n="response.title">RSVP</h1>
        <div class="rsvp-thank-you" id="thank-you" hidden>
          <p class="rsvp-thank-you-msg" data-i18n="response.thank-you">Thank you for letting us know.</p>
          <button type="button" class="rsvp-change-btn" id="change-response-btn" data-i18n="response.change">Change response</button>
        </div>
        <form class="rsvp-form" id="rsvp-form">
          <div class="rsvp-options">
            <label class="rsvp-option">
              <input type="radio" name="attendance" value="yes" checked />
              <span data-i18n="response.can-come">I can come :)</span>
            </label>
            <label class="rsvp-option">
              <input type="radio" name="attendance" value="no" />
              <span data-i18n="response.cannot-come">I can not come :(</span>
            </label>
          </div>
          <div class="rsvp-form-fields" id="form-fields">
            <div class="form-group" id="rsvp-name-group">
              <label for="rsvp-name" data-i18n="response.name">Name</label>
              <input type="text" id="rsvp-name" name="name" required autocomplete="name" placeholder="" />
            </div>
            <div class="form-group rsvp-guests-field" id="guests-field" hidden>
              <label for="rsvp-guests" data-i18n="response.guests">Number of guests</label>
              <input
                type="number"
                id="rsvp-guests"
                name="guests"
                min="1"
                max="99"
                step="1"
                inputmode="numeric"
                placeholder=""
              />
              <p
                class="rsvp-guests-cap-hint"
                id="rsvp-guests-cap-hint"
                hidden
                role="status"
                aria-live="polite"
              ></p>
              <div class="form-group rsvp-guest-names-combined-wrap" id="rsvp-guest-names-wrap" hidden>
                <label for="rsvp-guest-names-combined" data-i18n="response.guest-names-section">Guest names</label>
                <textarea
                  id="rsvp-guest-names-combined"
                  name="guestNamesCombined"
                  rows="3"
                  autocomplete="off"
                  data-i18n-placeholder="response.guest-names-placeholder"
                ></textarea>
                <p class="message-example rsvp-guest-names-hint" data-i18n="response.guest-names-hint">
                  Separate each full name with a comma. The number of names must match “Number of guests”.
                </p>
              </div>
            </div>
            <div class="form-group">
              <label for="rsvp-message" data-i18n="response.message">Message</label>
              <textarea id="rsvp-message" name="message" rows="3" placeholder=""></textarea>
              <p class="message-example" id="message-example" data-i18n="response.message-example">e.g. Dietary restrictions, allergies, or anything else you'd like us to know.</p>
            </div>
          </div>
          <p class="rsvp-form-error" id="rsvp-submit-error" hidden role="alert"></p>
          <button type="submit" class="rsvp-submit" data-i18n="response.send">Send answer</button>
        </form>
      </section>
    </main>
    <div class="scroll-progress" aria-hidden="true">
      <span class="scroll-dot" data-page="0"></span>
      <span class="scroll-dot" data-page="1"></span>
      <span class="scroll-dot" data-page="2"></span>
      <span class="scroll-dot" data-page="3"></span>
      <span class="scroll-dot" data-page="4"></span>
    </div>
  </body>
  <script src="/public/language.js"></script>
  <script src="/public/scroll-nav.js"></script>
  <script src="/public/nav-indicator.js"></script>
  <script src="/public/scroll-features.js"></script>
  <script src="/public/response-form.js"></script>
</html>
