<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Church - Wedding</title>
    <link rel="stylesheet" href="public/styles.css?v=2" />
  </head>
  <body class="page-church">
    <nav class="navbar">
      <div class="nav-indicator" aria-hidden="true"></div>
      <a class="brand" href="/" data-i18n="nav.wedding">Wedding</a>
      <a class="nav-link" href="/church" data-i18n="nav.church">Church</a>
      <a class="nav-link" href="/venue" data-i18n="nav.venue">Venue</a>
      <!-- <a class="nav-link" href="/photo" data-i18n="nav.photo">Photo</a> -->
      <a class="nav-link" href="/last" data-i18n="nav.more">More</a>
      <a class="nav-link" href="/response" data-i18n="nav.response">Response</a>
      <div class="lang-dropdown">
        <button class="lang-btn" aria-label="Language">EN</button>
        <div class="lang-menu">
          <button data-lang="en">English</button>
          <button data-lang="sv">Svenska</button>
        </div>
      </div>
    </nav>
    <main class="content">
      <blockquote class="church-quote church-quote-love">
        <p class="church-quote-love-word" data-i18n="church.quote.word">Love</p>
        <p class="church-quote-line" data-i18n="church.quote.line">one another as I have loved you</p>
        <cite class="church-quote-cite" data-i18n="church.quote.cite">John 15:12</cite>
      </blockquote>
      <a
        class="map-link"
        href="https://www.google.com/maps/search/?api=1&query=Storgatan%202%2C%20Stockholm"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open map for Storgatan 2, Stockholm"
      >
        <span class="map-link-icon" aria-hidden="true">📍</span>
      </a>
      <div class="church-details">
        <h1 class="church-title" data-i18n="church.title">Hedvig Eleonora kyrka</h1>
        <p class="subtitle church-time" data-i18n="church.time">16:00</p>
        <p class="subtitle church-address" data-i18n="church.address">Storgatan 2, Stockholm</p>
      </div>
    </main>
    <div class="scroll-progress" aria-hidden="true">
      <span class="scroll-dot" data-page="0"></span>
      <span class="scroll-dot" data-page="1"></span>
      <span class="scroll-dot" data-page="2"></span>
      <span class="scroll-dot" data-page="3"></span>
      <span class="scroll-dot" data-page="4"></span>
    </div>
  </body>
  <script src="/public/language.js"></script>
  <script src="/public/scroll-nav.js"></script>
  <script src="/public/nav-indicator.js"></script>
  <script src="/public/scroll-features.js"></script>
  <script src="/public/response-form.js"></script>
</html>
