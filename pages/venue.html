<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinue - Wedding</title>
    <link rel="stylesheet" href="public/styles.css?v=2" />
  </head>
  <body class="page-venue">
    <nav class="navbar">
      <div class="nav-indicator" aria-hidden="true"></div>
      <a class="brand" href="/" data-i18n="nav.wedding">Wedding</a>
      <a class="nav-link" href="/church" data-i18n="nav.church">Church</a>
      <a class="nav-link" href="/venue" data-i18n="nav.venue">Venue</a>
      <a class="nav-link" href="/photo" data-i18n="nav.photo">Photo</a>
      <a class="nav-link" href="/last" data-i18n="nav.more">More</a>
      <div class="lang-dropdown">
        <button class="lang-btn" aria-label="Language">EN</button>
        <div class="lang-menu">
          <button data-lang="en">English</button>
          <button data-lang="sv">Svenska</button>
        </div>
      </div>
    </nav>
    <main class="content">
      <video
        class="venue-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        poster="/public/images/VenueMobile.png?v=2"
      >
        <source src="/public/Videos/downloadfile-3.mp4?v=2" type="video/mp4" />
        <source src="/Videos/downloadfile-3.mp4?v=2" type="video/mp4" />
      </video>
      <a
        class="map-link"
        href="https://www.google.com/maps/search/?api=1&query=Segersbyv%C3%A4gen%207%2C%20145%2063%20Norsborg"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open map for Segersbyvägen 7, 145 63 Norsborg"
      >
        <span class="map-link-icon" aria-hidden="true">📍</span>
      </a>
      <div class="church-details venue-details">
        <h1 class="church-title venue-title" data-i18n="venue.title">Cello Slottet</h1>
        <p class="subtitle church-time" data-i18n="venue.time">18:00</p>
        <p class="subtitle church-address" data-i18n="venue.address">Segersbyvägen 7, 145 63 Norsborg</p>
      </div>
    </main>
    <div class="scroll-progress" aria-hidden="true">
      <span class="scroll-dot" data-page="0"></span>
      <span class="scroll-dot" data-page="1"></span>
      <span class="scroll-dot" data-page="2"></span>
      <span class="scroll-dot" data-page="3"></span>
      <span class="scroll-dot" data-page="4"></span>
    </div>
  </body>
  <script src="/public/language.js"></script>
  <script src="/public/scroll-nav.js"></script>
  <script src="/public/nav-indicator.js"></script>
  <script src="/public/scroll-features.js"></script>
</html>
