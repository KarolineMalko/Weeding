<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RSVP admin - Wedding</title>
    <link rel="stylesheet" href="/public/styles.css?v=9" />
  </head>
  <body class="page-admin">
    <main class="content admin-content">
      <section class="admin-panel">
        <h1>RSVP responses</h1>
        <p class="admin-lead">
          Enter the same secret token you set as <code>WEDDING_ADMIN_TOKEN</code> on the server. Do not share this page or the token.
        </p>
        <div class="admin-login-row">
          <label for="admin-token">Admin token</label>
          <div class="admin-token-input-row">
            <input type="password" id="admin-token" autocomplete="off" class="admin-token-input" />
            <button
              type="button"
              class="admin-token-toggle"
              id="admin-token-toggle"
              aria-pressed="false"
              aria-label="Show admin token"
            >
              Show
            </button>
          </div>
          <button type="button" class="admin-load-btn" id="admin-load-btn">Load responses</button>
        </div>
        <p class="admin-form-error" id="admin-error" hidden role="alert"></p>
        <div class="admin-table-wrap" id="admin-table-wrap" hidden>
          <div class="admin-table-toolbar">
            <button type="button" class="admin-add-open-btn" id="admin-add-open" aria-label="Add RSVP row">
              +
            </button>
          </div>
          <div class="admin-table-scroll">
            <table class="admin-table" id="admin-table">
              <thead>
                <tr>
                  <th>When (UTC)</th>
                  <th>Attending</th>
                  <th>Code</th>
                  <th>Name / names</th>
                  <th>#</th>
                  <th>Message</th>
                  <th class="admin-col-actions">Actions</th>
                </tr>
              </thead>
              <tbody id="admin-tbody"></tbody>
            </table>
          </div>
          <p class="admin-summary" id="admin-summary"></p>
        </div>

        <dialog id="admin-add-dialog" class="admin-add-dialog">
          <div class="admin-add-dialog-inner">
            <div class="admin-add-dialog-header">
              <h2 id="admin-add-dialog-title">Add RSVP</h2>
              <button type="button" class="admin-add-dialog-close" id="admin-add-dialog-close" aria-label="Close">
                ×
              </button>
            </div>
            <div class="admin-add-dialog-body">
              <div class="admin-add-dialog-field">
                <label for="admin-add-attending">Attendance</label>
                <select id="admin-add-attending" class="admin-add-select">
                  <option value="yes">Yes — attending</option>
                  <option value="no">No — declined</option>
                </select>
              </div>
              <div id="admin-add-yes-fields" class="admin-add-dialog-yes-block">
                <div class="admin-add-dialog-field">
                  <label for="admin-add-guests">Number of guests</label>
                  <input type="number" id="admin-add-guests" class="admin-add-input" min="1" max="99" value="1" />
                </div>
                <div class="admin-add-dialog-field">
                  <label for="admin-add-guest-names">Guest names</label>
                  <textarea
                    id="admin-add-guest-names"
                    class="admin-add-textarea"
                    rows="4"
                    placeholder="Comma or newline separated. Must match the count above."
                  ></textarea>
                </div>
              </div>
              <div id="admin-add-no-fields" class="admin-add-dialog-field" hidden>
                <label for="admin-add-name-no">Name</label>
                <input type="text" id="admin-add-name-no" class="admin-add-input" autocomplete="name" />
              </div>
              <div class="admin-add-dialog-field">
                <label for="admin-add-invite">Invite code (optional)</label>
                <input
                  type="text"
                  id="admin-add-invite"
                  class="admin-add-input"
                  maxlength="64"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Leave blank for none"
                />
              </div>
              <div class="admin-add-dialog-field">
                <label for="admin-add-message">Message (optional)</label>
                <textarea id="admin-add-message" class="admin-add-textarea" rows="2" placeholder="Notes from guest"></textarea>
              </div>
            </div>
            <div class="admin-add-dialog-actions">
              <button type="button" class="admin-add-cancel-btn" id="admin-add-cancel">Cancel</button>
              <button type="button" class="admin-add-submit-btn" id="admin-add-submit">Add</button>
            </div>
          </div>
        </dialog>
      </section>
    </main>
    <script src="/public/admin-page.js"></script>
  </body>
</html>
